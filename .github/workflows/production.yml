name: Production EAS Build and Submit

on:
  push:
    branches:
      - release

defaults:
  run:
    working-directory: fast-meal

jobs:
  production:
    name: Android production build and submit
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN GitHub secret. Create an Expo access token and add it as EXPO_TOKEN."
            exit 1
          fi
        working-directory: .

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fast-meal/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: EAS production build and Google Play submit
        run: eas build --platform android --profile production --non-interactive --auto-submit --wait
